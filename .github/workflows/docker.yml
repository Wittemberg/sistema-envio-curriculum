name: Build curriculum app image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/wittemberg/sistema-envio-curriculum:latest

      - name: Redeploy Portainer
        run: |
          if [ "${{ secrets.ENABLE_PORTAINER_DEPLOY }}" = "true" ]; then
            curl -fsS -X POST "${{ secrets.PORTAINER_WEBHOOK_CURRICULUM }}"
          else
            echo "Portainer redeploy disabled."
          fi
